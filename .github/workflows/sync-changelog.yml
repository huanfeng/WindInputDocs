name: Sync Changelog from Release

on:
  repository_dispatch:
    types:
      - changelog-updated
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          if [ -n "$TAG" ]; then
            gh api repos/huanfeng/WindInput/releases/tags/$TAG > /tmp/latest_release.json
          else
            gh api repos/huanfeng/WindInput/releases/latest > /tmp/latest_release.json
          fi
          TAG=$(jq -r '.tag_name' /tmp/latest_release.json)
          echo "Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync release notes to changelog
        run: python3 scripts/sync_release_notes.py /tmp/latest_release.json

      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WINDINPUT_REPO_DISPATCH_TOKEN }}
          title: "docs: 同步更新日志 ${{ steps.release.outputs.tag }}"
          branch: auto/sync-changelog
          commit-message: "docs: 同步更新日志 ${{ steps.release.outputs.tag }}"
          body: |
            自动从 GitHub Release 同步用户向更新说明到 changelog。
          labels: documentation

      - name: Enable auto-merge (rebase)
        if: steps.create-pr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ secrets.WINDINPUT_REPO_DISPATCH_TOKEN }}
        run: gh pr merge --rebase --auto ${{ steps.create-pr.outputs.pull-request-number }}
