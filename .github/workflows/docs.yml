name: Validate Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-validate"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        env:
          WINDINPUT_DOCS_BASE: /WindInput/
        run: pnpm build

      - name: Upload build artifact for PR inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          if-no-files-found: error

  notify-windinput:
    name: Notify WindInput
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs update event
        env:
          DISPATCH_TOKEN: ${{ secrets.WINDINPUT_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing secret: WINDINPUT_REPO_DISPATCH_TOKEN" >&2
            exit 1
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/huanfeng/WindInput/dispatches \
            -d @- <<EOF
          {
            "event_type": "docs-updated",
            "client_payload": {
              "source_repo": "huanfeng/WindInputDocs",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref_name }}",
              "source_run_id": "${{ github.run_id }}"
            }
          }
          EOF
